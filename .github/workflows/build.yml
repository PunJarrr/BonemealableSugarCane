name: Build

# On every push and pull request: builds the jar, runs the unit tests, then runs the smoke test
# (scripts/smoke-test.sh) on every test server in parallel. The smoke test accepts the Minecraft
# EULA (https://aka.ms/MinecraftEULA) for its throwaway test servers.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      servers: ${{ steps.servers.outputs.servers }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and run unit tests
        run: ./gradlew build

      - name: List test servers
        id: servers
        run: echo "servers=$(./gradlew -q testServers | awk '{ print $1 }' | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: BonemealableSugarCane
          path: build/libs/*.jar

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        server: ${{ fromJson(needs.build.outputs.servers) }}
    name: smoke-test (${{ matrix.server }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            25
            21

      - uses: gradle/actions/setup-gradle@v4

      - name: Smoke test
        run: scripts/smoke-test.sh "${{ matrix.server }}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-log-${{ matrix.server }}
          path: build/smoke/*.log
