name: BonemealableSugarCane
version: '${version}'

main: dev.punjarrr.bonemealablesugarcane.BonemealableSugarCane
# The oldest supported version. Servers older than 1.20.5 refuse to load the plugin with a clear message.
api-version: '1.20.5'
load: POSTWORLD

authors: [ PunJarrr ]
description: Adds Bedrock-style bone meal support for sugar cane.
website: https://modrinth.com/plugin/bonemealable-sugar-cane

commands:
  bonemealablesugarcane:
    description: Main BonemealableSugarCane command
    usage: /bonemealablesugarcane [help|reload|version|info]
    aliases: [ bsc ]
    permission: bonemealablesugarcane.command

permissions:
  bonemealablesugarcane.command:
    description: Allows use of /bonemealablesugarcane
    default: true

  bonemealablesugarcane.reload:
    description: Allows reloading the config
    default: op
